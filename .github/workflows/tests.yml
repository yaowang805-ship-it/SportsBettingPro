name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        run: ruff check src/ tests/ --output-format github

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.9", "3.10"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Copy .env.example to .env
        run: cp .env.example .env

      - name: Create data directories
        run: |
          mkdir -p data/storage data/processed models logs
          touch data/storage/bet_history.csv
          touch data/storage/performance_history.csv

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short -x

      - name: Test core imports
        run: |
          python -c "from src.core.interpretability import explain_prediction; print('✅ interpretability')"
          python -c "from src.risk.manager import RiskManager; print('✅ risk manager')"
          python -c "from src.monitor.performance import PerformanceMonitor; print('✅ performance monitor')"
